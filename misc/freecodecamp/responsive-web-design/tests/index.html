<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests</title>
  <style>
    div {
      width: 80px;
      height: 50%;
    }

    #first-div {
      background-color: #4d70b2;
      align-self: flex-end;
    }

    #second-div {
      background-color: #5c4db2;
    }

    #third-div {
      background-color: #4da3b2;
    }

    main {
      display: flex;
      border: 12px solid #444;
      flex-flow: row wrap;
      width: 50vh;
      height: 25vh;
      margin: 0 25vh;
      justify-content: space-evenly;
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <main>
      <div id="first-div"></div>
      <div id="second-div"></div>
      <div id="third-div"></div>
    </main>
  </div>
</body>

</html>
