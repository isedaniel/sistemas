<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad 2</title>
<style>
  body {
    font-size: 1.1em;
    font-family: monospace;
  }

  .error {
    color: red;
  }
</style>
</head>

<body>
  <div id="mensajes">

  </div>
  <button id="solicitud-erronea">Solicitud errónea</button>
  <div id="posts">

  </div>
  <div id="comentarios">

  </div>
  <script>
    let posts = [];
    const postsDiv = document.querySelector('#posts');
    const commentDiv = document.querySelector('#comentarios');

    async function getPosts(URL) {
      try {
        const res = await fetch(URL);

        if (!res.ok) {
          throw new Error('Error en la solicitud');
        }

        posts = await res.json();
        posts.forEach(el => {
          const title = document.createElement('p');
          title.innerText = `Title: ${el['title']}\n`
          postsDiv.appendChild(title);

          const body = document.createElement('p');
          body.innerText += `Body: ${el['body']}\n`
          postsDiv.appendChild(body);

          const btn = document.createElement('button');
          btn.innerText = "Ver comentarios...";
          btn.addEventListener('click', () => {
            getComments(el['id']);
          });
          postsDiv.appendChild(btn);
        });
      }
      catch (e) {
        console.error(e);
        const mensajesDiv = document.querySelector('#mensajes');
        mensajesDiv.classList = ['error'];
        mensajesDiv.innerText = e;
      }
    }

    async function getComments(id) {
      try {
        const res = await fetch(`https://jsonplaceholder.typicode.com/comments?postId=${id}`);

        if (!res.ok) {
          throw new Error('Error en la solicitud de comentarios');
        }

        const comments = await res.json();
        comments.forEach(el => {
          commentDiv.innerText = '';

          const postID = document.createElement('h2');
          postID.innerText = `Post Id: ${id}`;
          commentDiv.appendChild(postID);

          const name = document.createElement('p');
          name.innerText = `Name: ${el['name']}\n`
          commentDiv.appendChild(name);

          const email = document.createElement('p');
          email.innerText = `Email: ${el['email']}\n`
          commentDiv.appendChild(email);

          const body = document.createElement('p');
          body.innerText = `Body: ${el['body']}\n`
          commentDiv.appendChild(body);
        });
      }
      catch (e) {
        console.error(e);
      }

    }

    getPosts('https://jsonplaceholder.typicode.com/posts');

    const errBtn = document.querySelector('#solicitud-erronea');
    errBtn.addEventListener('click', () => {
      getPosts('https://jsonplaceholder.typicode.com/solicitud_erronea');
    })
  </script>
</body>

</html>
